name: CI

# The quality gate for this repository. Before this file existed, `tsc` and `vitest` only ever ran
# by hand on the author's machine, and `main` stayed red for 21 days with nothing but STATUS.md
# saying so.
#
# The repo runs on the GitHub Free plan and was private until 2026-08-20, so branch protection
# returned 403 and the real gate had to live here rather than in the repo settings. Now that the
# repo is public, `Require status checks` should point at the two job names below — and note that
# the job NAME is the protection context, so renaming a job silently detaches the rule.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # The TypeScript layer: op_declaration parser, MAGIC price arithmetic, consume plan. Pure code,
  # no network, no other repository. The job name is kept unchanged on purpose: it is the
  # branch-protection context.
  core:
    name: Core (tsc + vitest)
    runs-on: [self-hosted, tiger, isolated]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.core.json
      # Every test file under tests/ (vitest.config.ts), not a hand-picked list: a list goes stale
      # silently when a file is added.
      - run: npx vitest run

  # Aiken contracts under onchain/ (on main since 2b35232). The job still skips itself when the
  # directory is absent, so an old branch without it does not fail.
  onchain:
    name: Contracts (aiken check)
    runs-on: [self-hosted, tiger, isolated]
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: |
          if [ -d onchain/orilife_treasury ]; then echo "present=yes" >> "$GITHUB_OUTPUT";
          else echo "present=no" >> "$GITHUB_OUTPUT"; echo "No onchain/ on this branch — skipping."; fi
      # Pinned: the script hash depends on the compiler version. The blueprint currently in use was
      # produced by Aiken v1.1.21+42babe5 (read from the `preamble` of onchain/orilife_treasury/plutus.json).
      # A gate on a floating compiler goes red or green according to something outside this repo.
      #
      # No download here. The Tiger runner's CPU (Xeon E5-2680 v3, Haswell) has no `adx`, and the
      # prebuilt release binary (install.aiken-lang.org / aikup) loads, then dies with SIGILL (exit 132)
      # as soon as it compiles the stdlib. The runner account carries aiken built from source at the
      # pinned commit; this step only checks that it is there and is the pinned build.
      - if: steps.present.outputs.present == 'yes'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          command -v aiken >/dev/null || { echo "::error::no aiken on the runner; expected v1.1.21+42babe5 built from source (cargo install --git https://github.com/aiken-lang/aiken --rev 42babe5 --locked aiken)"; exit 1; }
          v=$(aiken --version)
          echo "aiken: $(command -v aiken) -> $v"
          case "$v" in *"v1.1.21+42babe5"*) ;; *) echo "::error::aiken on the runner is '$v', pinned v1.1.21+42babe5"; exit 1;; esac
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - if: steps.present.outputs.present == 'yes'
        working-directory: onchain/orilife_treasury
        run: aiken check
